name: silent_camera
description: mumumu 向けの無音（静音）キャプチャプラグイン。
version: 0.1.0
publish_to: "none"

environment:
  sdk: ^3.5.0
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: dev.srzzumix.silent_camera
        pluginClass: SilentCameraPlugin
      ios:
        pluginClass: SilentCameraPlugin
